<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Quản Lý Dữ Liệu</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f8fafc;
      color: #334155;
      min-height: 100vh;
    }

    /* ==========================================
       1. MÀN HÌNH LOADING KHỞI ĐỘNG (FULL SCREEN)
       ========================================== */
    #app-loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      color: #ffffff;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .loader-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-left-color: #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loader-title {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 15px;
      letter-spacing: 0.5px;
    }

    .progress-container {
      width: 280px;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 10px;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.2);
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #60a5fa);
      border-radius: 10px;
      transition: width 0.2s ease;
    }

    .progress-text {
      font-size: 0.85rem;
      color: #94a3b8;
    }

    .loading-hidden {
      opacity: 0;
      visibility: hidden;
    }

    /* ==========================================
       2. GIAO DIỆN CHÍNH & BÀI ĐĂNG
       ========================================== */
    .container {
      max-width: 1000px;
      margin: 30px auto;
      padding: 20px;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      padding: 15px 25px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      margin-bottom: 25px;
    }

    .btn-refresh {
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn-refresh:hover {
      background-color: #1d4ed8;
    }

    .btn-refresh .refresh-icon {
      display: inline-block;
      transition: transform 0.3s ease;
    }

    /* Hiệu ứng xoay icon khi đang làm mới */
    .btn-refresh.loading .refresh-icon {
      animation: spin 0.8s linear infinite;
    }

    /* Hiệu ứng giữ nguyên vị trí, mờ nhẹ danh sách khi reload */
    .posts-loading-overlay {
      opacity: 0.5;
      pointer-events: none;
      filter: blur(1px);
      transition: opacity 0.3s ease;
    }

    .posts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .post-card {
      background: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
    }

    /* ==========================================
       3. WATERMARK CHỮ MỜ TRẮNG + BÓNG ĐEN
       ========================================== */
    .img-watermark-container {
      position: relative;
      width: 100%;
      height: 200px;
      background-color: #0f172a;
      overflow: hidden;
      user-select: none;
      -webkit-user-drag: none;
    }

    .img-watermark-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none; /* Khóa tác động chuột trực tiếp vào ảnh */
    }

    .watermark-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
      z-index: 2;
    }

    .watermark-text {
      color: rgba(255, 255, 255, 0.65); /* Màu chữ trắng mờ nổi bật */
      font-size: 1.3rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      transform: rotate(-25deg); /* Nghiêng chéo ảnh */
      text-shadow: 0px 0px 4px rgba(0, 0, 0, 0.9), 2px 2px 3px rgba(0, 0, 0, 1); /* Bóng đen sắc nét */
      white-space: nowrap;
    }

    .post-content {
      padding: 15px;
    }

    .post-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: #1e293b;
    }

    .post-desc {
      font-size: 0.9rem;
      color: #64748b;
    }
  </style>
</head>
<body>

  <!-- MÀN HÌNH LOADING KHI VỪA VÀO TRANG -->
  <div id="app-loading-screen">
    <div class="loader-spinner"></div>
    <div class="loader-title">Đang tải dữ liệu hệ thống...</div>
    <div class="progress-container">
      <div class="progress-bar" id="loading-bar"></div>
    </div>
    <div class="progress-text" id="loading-text">0%</div>
  </div>

  <!-- NỘI DUNG CHÍNH WEB -->
  <div class="container" id="main-content" style="display: none;">
    
    <div class="header-bar">
      <h2>Danh Sách Bài Đăng</h2>
      <button id="btn-refresh-posts" class="btn-refresh" onclick="refreshPosts()">
        <span class="refresh-icon">🔄</span> Làm mới bài đăng
      </button>
    </div>

    <!-- KHUNG DANH SÁCH BÀI ĐĂNG -->
    <div class="posts-grid" id="posts-container">
      <!-- Mẫu bài đăng 1 -->
      <div class="post-card">
        <div class="img-watermark-container">
          <img src="https://picsum.photos/400/250?random=1" alt="Mẫu đính kèm">
          <div class="watermark-overlay">
            <span class="watermark-text">BẢO VỆ BẢN QUYỀN</span>
          </div>
        </div>
        <div class="post-content">
          <div class="post-title">Mẫu Thiết Kế PowerPoint Chuyên Nghiệp</div>
          <div class="post-desc">Tài liệu đã được bảo mật. Bấm tải về để lấy bản gốc.</div>
        </div>
      </div>

      <!-- Mẫu bài đăng 2 -->
      <div class="post-card">
        <div class="img-watermark-container">
          <img src="https://picsum.photos/400/250?random=2" alt="Mẫu đính kèm">
          <div class="watermark-overlay">
            <span class="watermark-text">BẢO VỆ BẢN QUYỀN</span>
          </div>
        </div>
        <div class="post-content">
          <div class="post-title">Bộ Báo Cáo Tài Chính Chuẩn Excel</div>
          <div class="post-desc">Dữ liệu được đồng bộ trực tiếp từ hệ thống Google Sheets.</div>
        </div>
      </div>
    </div>

  </div>

  <script>
    // CẤU HÌNH APPS SCRIPT URL
    const CONFIG = {
      APPS_SCRIPT_URL: "https://script.google.com/macros/s/AKfycbzPpqOB6cAWxAEuXMwz6YdLt8y4_QuGFe3YBSdo685HUggiaJmj2BWv57W6omOU643IrA/exec",
      API_TIMEOUT_MS: 30000
    };

    // ==========================================
    // 1. CHẠY THANH TẢI DỮ LIỆU LOADING KHI MỞ TRANG
    // ==========================================
    window.addEventListener("DOMContentLoaded", () => {
      const progressBar = document.getElementById("loading-bar");
      const progressText = document.getElementById("loading-text");
      const loadingScreen = document.getElementById("app-loading-screen");
      const mainContent = document.getElementById("main-content");

      let currentProgress = 0;

      const progressInterval = setInterval(() => {
        if (currentProgress < 90) {
          currentProgress += Math.floor(Math.random() * 12) + 6;
          if (currentProgress > 90) currentProgress = 90;
          progressBar.style.width = currentProgress + "%";
          progressText.innerText = currentProgress + "%";
        }
      }, 120);

      // Ping tới Apps Script kiểm tra kết nối
      fetch(`${CONFIG.APPS_SCRIPT_URL}?action=ping`)
        .then(() => finishLoading())
        .catch(() => finishLoading());

      function finishLoading() {
        clearInterval(progressInterval);
        progressBar.style.width = "100%";
        progressText.innerText = "100%";

        setTimeout(() => {
          loadingScreen.classList.add("loading-hidden");
          mainContent.style.display = "block";
        }, 350);
      }
    });

    // ==========================================
    // 2. NÚT LÀM MỚI BÀI ĐĂNG (GIỮ NGUYÊN VỊ TRÍ + MỜ NHẤP NHÁY)
    // ==========================================
    function refreshPosts() {
      const btn = document.getElementById("btn-refresh-posts");
      const container = document.getElementById("posts-container");

      // Bật hiệu ứng xoay icon & làm mờ danh sách
      btn.classList.add("loading");
      btn.disabled = true;
      container.classList.add("posts-loading-overlay");

      const currentUser = JSON.parse(localStorage.getItem("user") || "{}");
      const username = currentUser.username || "";
      const password = currentUser.password || "";

      // Gửi request lấy dữ liệu mới
      fetch(`${CONFIG.APPS_SCRIPT_URL}?action=getposts&username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`)
        .then(res => res.json())
        .then(data => {
          if (data.success && data.data && data.data.length > 0) {
            renderPosts(data.data);
          }
        })
        .catch(err => console.error("Lỗi làm mới:", err))
        .finally(() => {
          // Tắt hiệu ứng mờ nhấp nháy, trả lại giao diện bình thường
          setTimeout(() => {
            btn.classList.remove("loading");
            btn.disabled = false;
            container.classList.remove("posts-loading-overlay");
          }, 400);
        });
    }

    // Hàm dựng lại HTML danh sách bài đăng kèm Watermark
    function renderPosts(posts) {
      const container = document.getElementById("posts-container");
      container.innerHTML = posts.map(post => `
        <div class="post-card">
          <div class="img-watermark-container">
            <img src="${(post.anhPreview && post.anhPreview[0]) ? post.anhPreview[0] : 'https://picsum.photos/400/250'}" alt="Preview">
            <div class="watermark-overlay">
              <span class="watermark-text">BẢO VỆ BẢN QUYỀN</span>
            </div>
          </div>
          <div class="post-content">
            <div class="post-title">${post.tieuDe || 'Bài Đăng'}</div>
            <div class="post-desc">${post.moTa || ''}</div>
          </div>
        </div>
      `).join('');
    }

    // ==========================================
    // 3. CHỐNG TẢI / LƯU ẢNH TRÁI PHÉP
    // ==========================================
    document.addEventListener('contextmenu', function (e) {
      if (e.target.tagName === 'IMG' || e.target.closest('.img-watermark-container')) {
        e.preventDefault();
        alert('⚠️ Hình ảnh thuộc bản quyền hệ thống, không được phép tải về!');
        return false;
      }
    });

    document.addEventListener('dragstart', function (e) {
      if (e.target.tagName === 'IMG') {
        e.preventDefault();
        return false;
      }
    });

    // ==========================================
    // 4. BẮT BẢO MẬT PHÍM TẮT (CTRL+S, CTRL+U, F12)
    // ==========================================
    let violationCount = 0;

    function triggerViolationWarning(reason) {
      violationCount++;

      if (violationCount < 3) {
        alert(`⚠️ CẢNH BẢO VI PHẠM (${violationCount}/3):\nBạn vừa thực hiện thao tác cấm (${reason})!\nNếu vi phạm 3 lần, tài khoản của bạn sẽ bị TỰ ĐỘNG KHÓA.`);
        return;
      }

      alert(`⛔ TÀI KHOẢN ĐÃ BỊ KHÓA!\nBạn đã vi phạm sử dụng phím tắt (${reason}) quá 3 lần.`);

      const currentUser = JSON.parse(localStorage.getItem("user") || "{}");
      const username = currentUser.username || currentUser.email || "";

      if (username) {
        fetch(`${CONFIG.APPS_SCRIPT_URL}?action=lockuser&username=${encodeURIComponent(username)}`)
          .then(res => res.json())
          .then(data => console.log("Khóa tài khoản:", data))
          .catch(err => console.error("Lỗi:", err))
          .finally(() => {
            localStorage.clear();
            window.location.reload();
          });
      } else {
        localStorage.clear();
        window.location.reload();
      }
    }

    document.addEventListener("keydown", function (e) {
      const key = e.key.toUpperCase();
      const ctrlOrCmd = e.ctrlKey || e.metaKey;

      if (ctrlOrCmd && key === "S") {
        e.preventDefault();
        e.stopPropagation();
        triggerViolationWarning("Ctrl + S - Lưu trang");
        return false;
      }

      if (ctrlOrCmd && key === "U") {
        e.preventDefault();
        e.stopPropagation();
        triggerViolationWarning("Ctrl + U - Xem nguồn trang");
        return false;
      }

      if (e.key === "F12" || e.keyCode === 123) {
        e.preventDefault();
        e.stopPropagation();
        triggerViolationWarning("F12 - DevTools");
        return false;
      }

      if (ctrlOrCmd && e.shiftKey && (key === "I" || key === "J" || key === "C")) {
        e.preventDefault();
        e.stopPropagation();
        triggerViolationWarning("Ctrl + Shift + " + key + " - Inspect");
        return false;
      }
    }, true);
  </script>
</body>
</html>
