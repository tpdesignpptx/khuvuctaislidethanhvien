<html lang="vi">
<head>

  <title>TP DESIGN PPTX — Mẫu PowerPoint & Poster Đẹp Miễn Phí | Slide Thuyết Trình</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="description" content="Kho mẫu PowerPoint và Poster đẹp, chuyên nghiệp cho học sinh, sinh viên và giáo viên.">
  <meta name="keywords" content="mẫu PowerPoint đẹp, slide thuyết trình, template PowerPoint miễn phí, mẫu poster đẹp, TP DESIGN PPTX">

  <meta property="og:title" content="TP DESIGN PPTX — Mẫu PowerPoint & Poster Đẹp">
  <meta property="og:description" content="Kho mẫu PowerPoint và Poster đẹp, chuyên nghiệp cho học sinh, sinh viên và giáo viên.">
  <meta property="og:image" content="https://i.ibb.co/mC7tWqp7/F0-B32-A25-E4-D7-4-AAF-85-D0-A13-B80037851.png">
  <meta property="og:locale" content="vi_VN">
  <meta property="og:site_name" content="TP DESIGN PPTX">
  <meta name="theme-color" content="#060818">
  <link rel="icon" href="https://i.ibb.co/mC7tWqp7/F0-B32-A25-E4-D7-4-AAF-85-D0-A13-B80037851.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { overflow-x: hidden; }
    html, body {
      height: 100%;
      background: #060818;
      color: #f0f2ff;
      font-family: "Be Vietnam Pro", system-ui, sans-serif;
      overflow-x: hidden;
      max-width: 100%;
    }
    body { position: relative; }

    /* Pre-loader TP DESIGN PPTX */
    .pre-load {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background: #060818;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    .pre-load.hidden { opacity: 0; visibility: hidden; }
    .pre-load-inner { text-align: center; }
    .pre-load-logo {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      margin: 0 auto 16px;
      display: block;
      border: 1px solid rgba(255, 255, 255, .12);
    }
    .pre-load-name { font-size: 18px; font-weight: 800; color: #f0f2ff; margin-bottom: 6px; }
    .pre-load-sub { font-size: 13px; color: rgba(240, 242, 255, .45); margin-bottom: 28px; }

    /* WATERMARK CHỮ MỜ TRẮNG NỔI BẬT TRÊN NỀN ẢNH */
    .img-watermark-container {
      position: relative;
      width: 100%;
      overflow: hidden;
      user-select: none;
      -webkit-user-drag: none;
    }
    .img-watermark-container img {
      display: block;
      width: 100%;
      pointer-events: none;
    }
    .watermark-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
      z-index: 2;
    }
    .watermark-text {
      color: rgba(255, 255, 255, 0.6);
      font-size: 1.2rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      transform: rotate(-25deg);
      text-shadow: 0px 0px 4px rgba(0, 0, 0, 0.9), 2px 2px 3px rgba(0, 0, 0, 1);
      white-space: nowrap;
    }

    /* HIỆU ỨNG LÀM MỚI BÀI ĐĂNG */
    .btn-refresh .refresh-icon {
      display: inline-block;
      transition: transform 0.3s ease;
    }
    .btn-refresh.loading .refresh-icon {
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .posts-loading-overlay {
      opacity: 0.5;
      pointer-events: none;
      filter: blur(1px);
      transition: opacity 0.3s ease;
    }
  </style>
</head>
<body>

  <!-- MÀN HÌNH LOADING PRE-LOADER GỐC -->
  <div class="pre-load" id="preLoad">
    <div class="pre-load-inner">
      <img class="pre-load-logo" src="https://i.ibb.co/mC7tWqp7/F0-B32-A25-E4-D7-4-AAF-85-D0-A13-B80037851.png" alt="TP DESIGN PPTX">
      <div class="pre-load-name">TP DESIGN PPTX</div>
      <div class="pre-load-sub" id="bootText">Slide xịn · Học đỉnh · Điểm cao</div>
      <div style="margin-top:20px;height:3px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden;width:180px;margin-left:auto;margin-right:auto;">
        <div style="height:100%;width:35%;border-radius:2px;background:linear-gradient(90deg,#6d5bff,#00d4ff);animation:barSlide 1.1s ease-in-out infinite"></div>
      </div>
      <style>@keyframes barSlide{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}</style>
    </div>
  </div>

  <!-- NỘI DUNG GIAO DIỆN CHÍNH -->
  <div id="__app_root" style="padding: 20px; max-width: 1200px; margin: 0 auto;">
    <header style="display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid rgba(255,255,255,0.1);">
      <h1 style="font-size: 1.5rem; color: #f0f2ff;">TP DESIGN PPTX</h1>
      <button id="btn-refresh" class="btn-refresh" onclick="refreshPosts()" style="background: #6d5bff; color: white; border: none; padding: 10px 18px; border-radius: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px;">
        <span class="refresh-icon">🔄</span> Làm mới bài đăng
      </button>
    </header>

    <main style="margin-top: 30px;">
      <div id="posts-container" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px;">
        <!-- Bài đăng mẫu 1 -->
        <div style="background: rgba(255,255,255,0.05); border-radius: 16px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1);">
          <div class="img-watermark-container">
            <img src="https://picsum.photos/400/250?random=1" alt="Preview Slide">
            <div class="watermark-overlay">
              <span class="watermark-text">TP DESIGN PPTX</span>
            </div>
          </div>
          <div style="padding: 15px;">
            <h3 style="font-size: 1.1rem; margin-bottom: 8px;">Slide PowerPoint Chuyên Nghiệp</h3>
            <p style="font-size: 0.85rem; color: rgba(240,242,255,0.6);">Mẫu slide thuyết trình tối ưu cho học sinh, sinh viên.</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    (function(){
      "use strict";

      const CONFIG = {
        APPS_SCRIPT_URL: "https://script.google.com/macros/s/AKfycbzPpqOB6cAWxAEuXMwz6YdLt8y4_QuGFe3YBSdo685HUggiaJmj2BWv57W6omOU643IrA/exec",
        API_TIMEOUT_MS: 30000
      };

      // TẮT PRE-LOADER KHI TRANG TẢI XONG
      window.addEventListener("load", function() {
        setTimeout(function() {
          var preLoad = document.getElementById("preLoad");
          if (preLoad) preLoad.classList.add("hidden");
        }, 800);
      });

      // HÀM LÀM MỚI BÀI ĐĂNG (GIỮ NGUYÊN VỊ TRÍ KHUNG)
      window.refreshPosts = function() {
        const btn = document.getElementById("btn-refresh");
        const container = document.getElementById("posts-container");

        btn.classList.add("loading");
        btn.disabled = true;
        container.classList.add("posts-loading-overlay");

        const currentUser = JSON.parse(localStorage.getItem("user") || "{}");
        const username = currentUser.username || "";
        const password = currentUser.password || "";

        fetch(`${CONFIG.APPS_SCRIPT_URL}?action=getposts&username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`)
          .then(res => res.json())
          .then(data => {
            if (data.success && data.data) {
              renderPosts(data.data);
            }
          })
          .catch(err => console.error("Lỗi làm mới:", err))
          .finally(() => {
            setTimeout(() => {
              btn.classList.remove("loading");
              btn.disabled = false;
              container.classList.remove("posts-loading-overlay");
            }, 400);
          });
      };

      function renderPosts(posts) {
        const container = document.getElementById("posts-container");
        container.innerHTML = posts.map(post => `
          <div style="background: rgba(255,255,255,0.05); border-radius: 16px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1);">
            <div class="img-watermark-container">
              <img src="${(post.anhPreview && post.anhPreview[0]) ? post.anhPreview[0] : 'https://picsum.photos/400/250'}" alt="Preview">
              <div class="watermark-overlay">
                <span class="watermark-text">TP DESIGN PPTX</span>
              </div>
            </div>
            <div style="padding: 15px;">
              <h3 style="font-size: 1.1rem; margin-bottom: 8px;">${post.tieuDe || 'Mẫu Slide'}</h3>
              <p style="font-size: 0.85rem; color: rgba(240,242,255,0.6);">${post.moTa || ''}</p>
            </div>
          </div>
        `).join('');
      }

      // CHỐNG TẢI / LƯU ẢNH TRÁI PHÉP
      document.addEventListener('contextmenu', function (e) {
        if (e.target.tagName === 'IMG' || e.target.closest('.img-watermark-container')) {
          e.preventDefault();
          alert('⚠️ Hình ảnh thuộc bản quyền TP DESIGN PPTX, không được phép tải về!');
          return false;
        }
      });

      document.addEventListener('dragstart', function (e) {
        if (e.target.tagName === 'IMG') {
          e.preventDefault();
          return false;
        }
      });

      // BẢO MẬT PHÍM TẮT & TỰ ĐỘNG KHÓA TÀI KHOẢN
      let violationCount = 0;

      function triggerViolationWarning(reason) {
        violationCount++;

        if (violationCount < 3) {
          alert(`⚠️ CẢNH BẢO VI PHẠM (${violationCount}/3):\nBạn vừa sử dụng phím tắt bị cấm (${reason})!\nNếu vi phạm 3 lần, tài khoản sẽ bị TỰ ĐỘNG KHÓA.`);
          return;
        }

        alert(`⛔ TÀI KHOẢN ĐÃ BỊ KHÓA!\nBạn đã vi phạm sử dụng phím tắt (${reason}) quá 3 lần.`);

        const currentUser = JSON.parse(localStorage.getItem("user") || "{}");
        const username = currentUser.username || currentUser.email || "";

        if (username) {
          fetch(`${CONFIG.APPS_SCRIPT_URL}?action=lockuser&username=${encodeURIComponent(username)}`)
            .then(res => res.json())
            .then(data => console.log("Khóa tài khoản:", data))
            .catch(err => console.error("Lỗi:", err))
            .finally(() => {
              localStorage.clear();
              window.location.reload();
            });
        } else {
          localStorage.clear();
          window.location.reload();
        }
      }

      document.addEventListener("keydown", function (e) {
        const key = e.key.toUpperCase();
        const ctrlOrCmd = e.ctrlKey || e.metaKey;

        if (ctrlOrCmd && key === "S") {
          e.preventDefault();
          e.stopPropagation();
          triggerViolationWarning("Ctrl + S - Lưu trang");
          return false;
        }

        if (ctrlOrCmd && key === "U") {
          e.preventDefault();
          e.stopPropagation();
          triggerViolationWarning("Ctrl + U - Xem nguồn");
          return false;
        }

        if (e.key === "F12" || e.keyCode === 123) {
          e.preventDefault();
          e.stopPropagation();
          triggerViolationWarning("F12 - DevTools");
          return false;
        }

        if (ctrlOrCmd && e.shiftKey && (key === "I" || key === "J" || key === "C")) {
          e.preventDefault();
          e.stopPropagation();
          triggerViolationWarning("Ctrl + Shift + " + key + " - Inspect");
          return false;
        }
      }, true);

    })();
  </script>
</body>
</html>
