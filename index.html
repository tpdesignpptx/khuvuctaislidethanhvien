<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Dữ Liệu</title>
  <style>
    /* ==========================================
       GIAO DIỆN KHUNG LOADING KHI VỪA MỞ TRANG
       ========================================== */
    #app-loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .loader-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-left-color: #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loader-title {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 15px;
      letter-spacing: 0.5px;
    }

    .progress-container {
      width: 280px;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 10px;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.2);
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #60a5fa);
      border-radius: 10px;
      transition: width 0.2s ease;
    }

    .progress-text {
      font-size: 0.85rem;
      color: #94a3b8;
    }

    /* Ẩn màn hình loading khi hoàn tất */
    .loading-hidden {
      opacity: 0;
      visibility: hidden;
    }
  </style>
</head>
<body>

  <!-- MÀN HÌNH LOADING KHI KHỞI ĐỘNG -->
  <div id="app-loading-screen">
    <div class="loader-spinner"></div>
    <div class="loader-title">Đang tải dữ liệu hệ thống...</div>
    <div class="progress-container">
      <div class="progress-bar" id="loading-bar"></div>
    </div>
    <div class="progress-text" id="loading-text">0%</div>
  </div>

  <!-- NỘI DUNG TRANG WEB DƯỚI ĐÂY -->
  <div id="main-content" style="display: none;">
    <!-- Đặt khung Đăng nhập / Nội dung trang web của bạn vào đây -->
    <h2 style="text-align: center; margin-top: 50px;">Đăng Nhập Hệ Thống</h2>
  </div>

  <script>
    // CẤU HÌNH API APPS SCRIPT
    const CONFIG = {
      APPS_SCRIPT_URL: "https://script.google.com/macros/s/AKfycbzPpqOB6cAWxAEuXMwz6YdLt8y4_QuGFe3YBSdo685HUggiaJmj2BWv57W6omOU643IrA/exec",
      API_TIMEOUT_MS: 30000
    };

    // ==========================================
    // 1. THANH TẢI DỮ LIỆU LOADING KHI MỞ TRANG
    // ==========================================
    window.addEventListener("DOMContentLoaded", () => {
      const progressBar = document.getElementById("loading-bar");
      const progressText = document.getElementById("loading-text");
      const loadingScreen = document.getElementById("app-loading-screen");
      const mainContent = document.getElementById("main-content");

      let currentProgress = 0;

      // Mô phỏng tiến trình tải mượt mà từ 0% -> 90%
      const progressInterval = setInterval(() => {
        if (currentProgress < 90) {
          currentProgress += Math.floor(Math.random() * 10) + 5;
          if (currentProgress > 90) currentProgress = 90;
          progressBar.style.width = currentProgress + "%";
          progressText.innerText = currentProgress + "%";
        }
      }, 150);

      // Ping kiểm tra backend Apps Script kết nối thành công
      fetch(`${CONFIG.APPS_SCRIPT_URL}?action=ping`)
        .then(() => finishLoading())
        .catch(() => finishLoading()); // Cho phép vào trang ngay cả khi mạng chậm

      function finishLoading() {
        clearInterval(progressInterval);
        progressBar.style.width = "100%";
        progressText.innerText = "100%";

        setTimeout(() => {
          loadingScreen.classList.add("loading-hidden");
          mainContent.style.display = "block";
        }, 400);
      }
    });

    // ==========================================
    // 2. BẮT TRIỆT ĐỂ CTRL+S, CTRL+U, F12, INSPECT
    // ==========================================
    let violationCount = 0;

    function triggerViolationWarning(reason) {
      violationCount++;

      // 2 lần đầu: Hiển thị thông báo cảnh báo
      if (violationCount < 3) {
        alert(`⚠️ CẢNH BẢO VI PHẠM (${violationCount}/3):\nBạn vừa thực hiện thao tác cấm (${reason})!\nNếu vi phạm 3 lần, tài khoản của bạn sẽ bị TỰ ĐỘNG KHÓA.`);
        return;
      }

      // Lần thứ 3: Khóa tài khoản trên Sheet & Đăng xuất
      alert(`⛔ TÀI KHOẢN ĐÃ BỊ KHÓA!\nBạn đã vi phạm sử dụng phím tắt (${reason}) quá 3 lần.`);

      const currentUser = JSON.parse(localStorage.getItem("user") || "{}");
      const username = currentUser.username || currentUser.email || "";

      if (username) {
        fetch(`${CONFIG.APPS_SCRIPT_URL}?action=lockuser&username=${encodeURIComponent(username)}`)
          .then(res => res.json())
          .then(data => console.log("Khóa tài khoản:", data))
          .catch(err => console.error("Lỗi:", err))
          .finally(() => {
            localStorage.clear();
            window.location.reload();
          });
      } else {
        localStorage.clear();
        window.location.reload();
      }
    }

    // Bắt sự kiện keydown toàn trang
    document.addEventListener("keydown", function (e) {
      const key = e.key.toUpperCase();
      const ctrlOrCmd = e.ctrlKey || e.metaKey;

      // Chặn Ctrl + S / Cmd + S (Lưu trang)
      if (ctrlOrCmd && key === "S") {
        e.preventDefault();
        e.stopPropagation();
        triggerViolationWarning("Ctrl + S - Lưu trang");
        return false;
      }

      // Chặn Ctrl + U / Cmd + U (Xem nguồn)
      if (ctrlOrCmd && key === "U") {
        e.preventDefault();
        e.stopPropagation();
        triggerViolationWarning("Ctrl + U - Xem nguồn trang");
        return false;
      }

      // Chặn F12 (DevTools)
      if (e.key === "F12" || e.keyCode === 123) {
        e.preventDefault();
        e.stopPropagation();
        triggerViolationWarning("F12 - DevTools");
        return false;
      }

      // Chặn Ctrl + Shift + I / J / C (Inspect)
      if (ctrlOrCmd && e.shiftKey && (key === "I" || key === "J" || key === "C")) {
        e.preventDefault();
        e.stopPropagation();
        triggerViolationWarning("Ctrl + Shift + " + key + " - Inspect");
        return false;
      }
    }, true);
  </script>
</body>
</html>
